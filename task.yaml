# CORAL task: dry plumbing run for cache_ext page-cache policy evolution.
#
# Goal of this task definition is NOT a real experiment — it's a minimal
# end-to-end proof that one CORAL agent (running on THIS host) can edit the
# seed policy, have the grader ssh to a CloudLab node that compiles it against
# the real cache_ext toolchain, attaches it via BPF struct_ops, runs it under
# the cgroup-isolated get_scan benchmark, and returns a score.
# See coral-cache-evolution's sibling repo mem-evolve/coral-learnings.md for
# the full migration research this is based on.

grader:
  entrypoint: "cache_evolution_grader.grader:Grader"
  setup:
    - "uv pip install -e ./grader"
  # Worst case: local calibration lock (600) + first-grade calibration call
  # (node lock 600 + compile 300 + 8*180 + slack) + one grade call (node lock
  # 600 + compile 300 + 180 + slack). Pre-calibrate to avoid the middle term.
  timeout: 4500
  direction: maximize
  # Mirrors mem-evolve/cache_policy_evolution/get_scan.toml (2026-08-13 scoring).
  args:
    policy_file: noop.c
    # SSH backend: set up once with remote/install_remote.sh <ssh_target>.
    ssh_target: aanil3@c220g1-030815.wisc.cloudlab.us
    ssh_key: ~/.ssh/coral_eval_ed25519
    benchmark: eval/get_scan/run_with_policy.sh   # relative to MEM_EVOLVE_ROOT on the node
    eval_timeout: 180
    calibrate_runs: 8
    min_n: 2
    squash: tanh
    lock_wait: 600
    stats_path: ~/.cache/cache_evolution_grader/get_scan_noop_stats.json
    required_probes: [throughput]
    weights:
      throughput: 2.0
      cgroup_iostat: 0.5
      cgroup_memstat: 0.25
    probes:
      - type: json_extract
        name: throughput
        results_file: results.json
        json_path: throughput_ops_per_sec
        direction: maximize
        unit: ops/s

agents:
  count: 1
  runtime: claude_code
  model: "claude-sonnet"   # matches the Bedrock alias already used by mem-evolve's [llm.mutator]
  gateway:
    enabled: true
    port: 4001              # distinct from mem-evolve's old coordinator proxy (idle on :4000)
    config: "./litellm_config.yaml"

workspace:
  repo_path: "./seed"
  results_dir: "./results"

run:
  session: local
  docker_image: ""
