# CORAL task: dry plumbing run for cache_ext page-cache policy evolution.
#
# Goal of this task definition is NOT a real experiment — it's a minimal
# end-to-end proof that one CORAL agent can edit the seed policy, have the
# grader compile it against the real cache_ext toolchain, attach it via BPF
# struct_ops, run it under the cgroup-isolated benchmark, and return a score.
# See coral-cache-evolution's sibling repo mem-evolve/coral-learnings.md for
# the full migration research this is based on.

grader:
  entrypoint: "cache_evolution_grader.grader:Grader"
  setup:
    - "uv pip install -e ./grader"
  # Must cover: lock wait (600) + compile + one eval (180, = get_scan.toml
  # `timeout`) -- and, on the very first grade if not pre-calibrated with
  # `python -m cache_evolution_grader.calibrate`, calibrate_runs * 180 more
  # for the noop baseline. 120 was too short even for a single eval.
  timeout: 2700
  direction: maximize
  # Mirrors mem-evolve/cache_policy_evolution/get_scan.toml (2026-08-13 scoring).
  args:
    policy_file: noop.c
    eval_timeout: 180
    calibrate_runs: 8
    min_n: 2
    squash: tanh
    lock_wait: 600
    stats_path: /run/evo_cache/get_scan_noop_stats.json
    # benchmark_script / source_dir / baseline_source default from MEM_EVOLVE_ROOT.
    required_probes: [throughput]
    weights:
      throughput: 2.0
      cgroup_iostat: 0.5
      cgroup_memstat: 0.25
    probes:
      - type: json_extract
        name: throughput
        results_file: results.json
        json_path: throughput_ops_per_sec
        direction: maximize
        unit: ops/s

agents:
  count: 1
  runtime: claude_code
  model: "claude-sonnet"   # matches the Bedrock alias already used by mem-evolve's [llm.mutator]
  gateway:
    enabled: true
    port: 4001              # distinct from mem-evolve's old coordinator proxy (idle on :4000)
    config: "./litellm_config.yaml"

workspace:
  repo_path: "./seed"
  results_dir: "./results"

run:
  session: local
  docker_image: ""
