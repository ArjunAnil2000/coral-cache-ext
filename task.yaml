# CORAL task: evolve a cache_ext page-cache eviction policy for the get_scan workload.
#
# One CORAL agent (running on THIS host) edits the policy file; the grader ssh-es to a
# CloudLab node that compiles it against the real cache_ext toolchain, attaches it via
# BPF struct_ops, runs it under the cgroup-isolated get_scan benchmark, and returns the
# measured throughput in ops/s as the score. The score is that absolute number -- no
# baseline normalization, z-score or tanh squash -- and the agent's job is to maximize it.
# Everything this task uses lives in this repo: node/ (what runs on the CloudLab
# node), third_party/cache_ext (submodule), grader/, seed/.

task:
  name: cache-ext-get-scan
  description: |
    Evolve a Linux page-cache eviction policy, written as an eBPF cache_ext
    struct_ops program, to maximize throughput on a GET-SCAN workload.

    ## Workload
    GET-SCAN over LevelDB: a Zipfian-skewed keyspace (a small minority of hot
    keys account for most traffic) under a 95%/5% GET/SCAN mix. Exactly one
    worker thread issues large sequential range scans (500 keys/scan); the rest
    issue point GETs against the hot-skewed distribution. The scan thread is
    the adversary: big sequential scans evict the hot GET working set from
    the cache. The benchmark runs in a memory-limited cgroup, so eviction
    decisions matter. The SCAN thread might/might not be pinned.

    ## Goal
    Maximize total throughput in operations per second (GETs plus SCANs, measured
    by the benchmark over its 30-second measured phase). Your score is exactly this
    number. Bytes read from disk, refaults and tail latency are not scored; they matter
    only insofar as they move throughput (a policy that reads fewer bytes but spends
    more CPU per operation can score lower).

    ## What you edit
    `noop.c` (one file, the repo root of your worktree). It has two sections,
    each wrapped in EVOLVE-BLOCK-START/END markers: `SECTION: BPF KERNEL CODE`
    (the struct_ops hooks `evo_policy_init`, `evo_policy_evict_folios`,
    `evo_policy_folio_added`, `evo_policy_folio_evicted`, optionally
    `evo_policy_folio_accessed`, plus the `evo_policy_ops` struct) and
    `SECTION: USERSPACE LOADER`. Keep both sections and the marker comments:
    the grader splits the file on them. The starting policy is S3-FIFO (a small
    FIFO admits new folios, a CLOCK-like main queue holds promoted ones, a ghost
    map remembers recent evictions); it works as-is. The cache_ext helper API
    headers are in `reference/` inside your worktree; `reference/cache_ext_lib.bpf.h`
    documents the helper API. These files are not graded. Do not go looking for other
    material outside your worktree.

    ## How you are graded
    You cannot compile or run anything locally (no cache_ext kernel here).
    Submit with `coral eval`. The grader ships your file to a dedicated
    benchmark machine, which compiles it, attaches it via BPF struct_ops, and
    runs the benchmark (~1 minute). The score you get back is the ABSOLUTE
    measured throughput in ops/sec (higher is better); it is not normalized,
    z-scored or squashed. Submit the
    starting policy (S3-FIFO) unchanged first to see its score.
    The feedback also lists bytes read, refaults and wallclock for diagnosis, but
    only throughput is the score. Repeated evaluations of identical code vary by
    roughly 1-2% (occasionally more), so differences of a few ops/sec between
    attempts are within noise; resubmit to confirm before trusting a small gain.
    Compile errors come back with clang's output. Evaluations are serialized
    on one machine, so be deliberate with submissions.

    ## Pitfalls (each costs an evaluation)
    - `is_folio_relevant(folio)` is true for every file under the watched
      directory, scan files included; it is not a hot/cold signal. Keep the
      early `if (!is_folio_relevant(folio)) return;` guard in hooks that add
      pages to your own lists; never manage non-watched pages (binary/libc/
      anon) -- it causes reclaim loops and stalls.
    - The BPF verifier rejects unbounded loops: use `bpf_for`/`bpf_repeat` with
      a compile-time bound (cap at ~64, exit early).
    - `INT64_MAX` is unavailable in BPF; use `0x7fffffffffffffffLL`.
    - 64-bit division/modulo by a non-constant can fail to build in BPF; use
      unsigned values and shifts/masks where possible.
    - Globals the loader reads via `skel->bss->NAME` must be non-const, at file
      scope, and actually referenced by BPF code.
    - A policy that hangs past the 180 s eval timeout is strictly worse than
      doing nothing.
  tips: |
    Your starting point is a working S3-FIFO policy in `noop.c`. Submit it
    unchanged first to get its score, then improve it one change at a time.
    Record what you learn (including dead ends) as notes.

grader:
  entrypoint: "cache_evolution_grader.grader:Grader"
  setup:
    - "uv pip install -e ./grader"
  # One grade = one remote call: node lock wait (600) + compile (300) + one eval (180)
  # + slack. No calibration step: the score is the raw throughput.
  timeout: 1500
  direction: maximize   # the score is throughput in ops/s; higher is better
  # Score = absolute throughput (ops/s) from the benchmark's results.json. Nothing else is scored.
  args:
    policy_file: noop.c
    # SSH backend: set up once with node/install_remote.sh <ssh_target>.
    ssh_target: aanil3@c220g1-030815.wisc.cloudlab.us
    ssh_key: ~/.ssh/coral_eval_ed25519
    benchmark: bench/get_scan/run_with_policy.sh   # relative to node/ in the deployed repo
    eval_timeout: 180
    lock_wait: 600
    required_probes: [throughput]   # a missing/invalid throughput fails the attempt instead of scoring 0
    probes:                         # throughput is the score; the default probes (bytes read, refaults, wallclock) are diagnostics
      - type: json_extract
        name: throughput
        results_file: results.json
        json_path: throughput_ops_per_sec
        direction: maximize
        unit: ops/s

agents:
  count: 1
  runtime: claude_code
  model: "claude-opus-5-5"   # alias in litellm_config.yaml (routes to Bedrock Opus 5.5)
  gateway:
    enabled: true
    port: 4001
    config: "./litellm_config.yaml"

workspace:
  repo_path: "./seed"
  results_dir: "./results"

run:
  session: local
  docker_image: ""
