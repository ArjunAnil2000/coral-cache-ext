# LiteLLM gateway config for CORAL's agent(s). Model calls route through AWS
# Bedrock using credentials from the environment (source ./litellm-creds.sh,
# which is gitignored -- never commit it), not a direct Anthropic API key.
#
# Model id bedrock/us.anthropic.claude-opus-5-5 validated 2026-10-07. The alias
# "claude-sonnet" is historical -- it routes to Opus 5.5.
model_list:
  - model_name: "claude-sonnet"
    litellm_params:
      model: "bedrock/us.anthropic.claude-opus-5-5"
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
      aws_region_name: os.environ/AWS_DEFAULT_REGION

  # Claude Code also sends side requests (observed in the first run's gateway log)
  # under its own model names; without an entry the gateway answers 400
  # "Invalid model name". Route them to the same Bedrock model.
  - model_name: "claude-sonnet-5"
    litellm_params:
      model: "bedrock/us.anthropic.claude-opus-5-5"
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
      aws_region_name: os.environ/AWS_DEFAULT_REGION

litellm_settings:
  drop_params: true
