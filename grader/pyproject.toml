[project]
name = "cache-evolution-grader"
version = "0.1.0"
description = "CORAL grader for cache_ext policy evolution: grades over SSH on a CloudLab node; the score is the measured throughput (ops/s)"
requires-python = ">=3.11"
dependencies = [
    "coral",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
