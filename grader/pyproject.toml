[project]
name = "cache-evolution-grader"
version = "0.1.0"
description = "CORAL grader wrapping mem-evolve's evaluator for cache_ext policy evolution (dry-run plumbing)"
requires-python = ">=3.11"
dependencies = [
    "coral",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
cache_evolution_grader = ["baseline_noop.c"]
